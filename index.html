<!DOCTYPE html>
<html lang="tr" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>UluKontrol - Akıllı Araç & Garaj Portalı</title>

  <!-- PWA & Mobil Meta Etiketleri -->
  <meta name="description" content="Akıllı Araç ve Garaj Yönetim Portalı, Periyodik Bakım, TÜVTÜRK Muayene ve Piyasa Değerleme Takibi" />
  <meta name="theme-color" content="#10B981" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="UluKontrol" />
  <meta name="application-name" content="UluKontrol" />

  <!-- İkonlar ve Manifest -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b'
            }
          }
        }
      }
    }
  </script>

  <!-- UluKontrol Tasarım Sistemi -->
  <link rel="stylesheet" href="./css/app.css" />
  <script>
    try {
      if (localStorage.getItem('ulukontrol_theme_v3') === 'dark') {
        document.documentElement.classList.remove('light');
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">
  <!-- Uygulamanın Dinamik Olarak Bağlanacağı Kök Eleman -->
  <div id="app-root" class="min-h-screen flex flex-col">
    <!-- Başlangıç yükleme göstergesi -->
    <div class="min-h-screen flex items-center justify-center bg-slate-50 text-emerald-600">
      <div class="flex flex-col items-center gap-3">
        <div class="w-14 h-14 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center animate-pulse shadow-sm">
          <svg class="w-7 h-7 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9C2.1 11.2 2 11.6 2 12v4c0 .6.4 1 1 1h2"/>
            <circle cx="7" cy="17" r="2"/>
            <path d="M9 17h6"/>
            <circle cx="17" cy="17" r="2"/>
          </svg>
        </div>
        <span class="text-xs font-bold tracking-wider text-slate-600">UluKontrol Yükleniyor...</span>
      </div>
    </div>
  </div>

  <!-- Ana Uygulama Çekirdeği -->
  <script src="./js/bundle.js"></script>
  <script>
    setTimeout(function() {
      var root = document.getElementById('app-root');
      if (root && root.innerHTML.indexOf('UluKontrol Yükleniyor') !== -1) {
        var btn = document.createElement('button');
        btn.textContent = 'Yükleme Uzun Sürdü - Yeniden Başlat';
        btn.className = 'mt-4 px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold shadow-md hover:bg-emerald-700 transition cursor-pointer';
        btn.onclick = function() {
          localStorage.clear();
          location.reload();
        };
        var wrapper = root.querySelector('.flex.flex-col.items-center');
        if (wrapper && !wrapper.querySelector('button')) {
          wrapper.appendChild(btn);
        }
      }
    }, 4500);
  </script>
</body>
</html>
